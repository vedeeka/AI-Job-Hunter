<!DOCTYPE html>
<html>
<head>
    <style>
        @page { size: A4; margin: 2cm; }
        body { font-family: sans-serif; color: #333; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; }
        .header { text-align: center; margin-bottom: 30px; }
        .section { margin-bottom: 20px; }
        .job { margin-bottom: 15px; }
        .job-title { font-weight: bold; font-size: 14px; }
        .company { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="border:none">{{ name }}</h1>
        <p>{{ email }} | {{ phone }} | {{ location }}</p>
    </div>

    <div class="section">
        <h1>Summary</h1>
        <p>{{ summary }}</p>
    </div>

    <div class="section">
        <h1>Experience</h1>
        {% for job in experience %}
        <div class="job">
            <div class="job-title">{{ job.title }}</div>
            <div class="company">{{ job.company }} | {{ job.dates }}</div>
            <p>{{ job.description }}</p>
        </div>
        {% endfor %}
    </div>

    <div class="section">
        <h1>Skills</h1>
        <p>{{ skills | join(', ') }}</p>
    </div>
</body>
</html>
